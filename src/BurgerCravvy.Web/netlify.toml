# Netlify: en "Base directory" pon src/BurgerCravvy.Web y este archivo se aplica solo.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Para que /panel y cualquier ruta carguen la app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
